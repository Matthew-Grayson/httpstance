[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "httpstance"
version = "0.1.0"
description = "HTTPS deployment and TLS posture scanner. A maintained replacement for pshtt."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC0-1.0" }
dependencies = [
    "httpx>=0.27",
    "anyio>=4.0",
    # cryptography ships abi3 wheels (cp37-abi3), so one wheel keeps working on
    # every future CPython 3.x without a new release. This is the structural
    # reason this package will not repeat pshtt's nassl problem.
    "cryptography>=42.0",
    "publicsuffixlist>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
httpstance = "httpstance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/httpstance"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
